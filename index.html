<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft | Site Oficial (Clone)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header">
      <a href="#" class="logo">
        <img src="assets/logo_pedra_300x51.svg" alt="Logotipo oficial do Minecraft em blocos de pedra">
      </a>
      <nav aria-label="Navegação principal">
        <ul>
          <li><a href="#jogos">JOGOS</a></li>
          <li><a href="#comunidade">COMUNIDADE</a></li>
          <li><a href="#loja">LOJA</a></li>
          <li><a href="#suporte">SUPORTE</a></li>
        </ul>
      </nav>
      <form class="search-form" action="#" method="GET">
        <label for="site-search" class="sr-only">Pesquisar no site:</label>
        <input type="search" id="site-search" name="q" placeholder="Buscar no Minecraft...">
        <button type="submit">Buscar</button>
      </form>

    </div>
  </header>

</body>
</html>
